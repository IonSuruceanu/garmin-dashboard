name: Garmin → Telegram

on:
  schedule:
    # Times are UTC. GitHub may start scheduled runs a few minutes late.
    - cron: "15 5 * * *" # morning: summary + dashboard update, 07:15 in Switzerland in summer, 06:15 in winter
    - cron: "40 * * * *" # every hour: message about any new activity
  workflow_dispatch: # "Run workflow" button
    inputs:
      task:
        description: What to run
        type: choice
        options: [both, morning summary and dashboard, new activities]
        default: both

permissions:
  contents: read

# One run at a time, so two runs never refresh the Garmin login at once.
concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.build.outputs.built }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GARMIN_TOKENS_SEED: ${{ secrets.GARMIN_TOKENS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # optional: Claude answers questions
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }} # optional: publishes the encrypted dashboard
      DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/garmin.enc.json
      # Encrypts what the job keeps between runs (see state.py).
      STATE_SECRET: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SUMMARY: ${{ github.event.schedule == '15 5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task != 'new activities') }}
      WATCH: ${{ github.event.schedule == '40 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.task != 'morning summary and dashboard') }}
    steps:
      - name: Check secrets are set
        id: check
        run: |
          missing=""
          [ -z "$GARMIN_TOKENS_SEED" ] && missing="$missing GARMIN_TOKENS"
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ] && missing="$missing TELEGRAM_CHAT_ID"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Missing repository secret(s):$missing. Add them under Settings → Secrets and variables → Actions → Repository secrets (see README)."
            # A manual run should fail loudly; scheduled runs skip quietly until setup is done.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::$msg"; exit 1
            fi
            echo "::notice::$msg Skipping."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements.txt

      # The Garmin login (refreshed on every run) and the saved history are kept in
      # the Actions cache, encrypted, so the next run can continue from them.
      - name: Restore saved state
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state.enc
          key: garmin-enc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: garmin-enc-

      - name: Decrypt saved state
        if: steps.check.outputs.ready == 'true'
        run: python state.py unpack

      - name: Use GARMIN_TOKENS secret if it is new
        if: steps.check.outputs.ready == 'true'
        run: |
          umask 077
          mkdir -p ~/.garminconnect
          seed_hash=$(printf '%s' "$GARMIN_TOKENS_SEED" | sha256sum | cut -d' ' -f1)
          # A changed secret (e.g. after signing in again on the Mac) replaces the saved login.
          if [ ! -f ~/.garminconnect/garmin_tokens.json ] || [ "$(cat ~/.garminconnect/seed.sha 2>/dev/null)" != "$seed_hash" ]; then
            printf '%s' "$GARMIN_TOKENS_SEED" > ~/.garminconnect/garmin_tokens.json
            echo "$seed_hash" > ~/.garminconnect/seed.sha
            echo "Using login from the GARMIN_TOKENS secret."
          else
            echo "Using login saved by the previous run."
          fi

      - name: Message new activities
        if: steps.check.outputs.ready == 'true' && env.WATCH == 'true'
        run: python activity_watch.py

      # Replies to /report, /today and /refresh sent while your Mac was off.
      - name: Answer Telegram commands
        if: steps.check.outputs.ready == 'true' && env.WATCH == 'true'
        run: python telegram_bot.py --once

      - name: Morning summary
        if: steps.check.outputs.ready == 'true' && env.SUMMARY == 'true'
        run: |
          python fetch_garmin.py
          python telegram_summary.py

      - name: Build the encrypted dashboard
        id: build
        if: steps.check.outputs.ready == 'true' && env.SUMMARY == 'true' && env.DASHBOARD_PASSWORD != ''
        run: |
          python publish.py --out _site
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.built == 'true'
        with:
          path: _site

      - name: Tell me on Telegram if it failed
        if: failure() && steps.check.outputs.ready == 'true'
        run: |
          curl -sS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Garmin → Telegram failed. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Encrypt state
        if: always() && steps.check.outputs.ready == 'true'
        run: python state.py pack

      - name: Save state
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .state.enc
          key: garmin-enc-${{ github.run_id }}-${{ github.run_attempt }}

  # Publishes the encrypted dashboard on GitHub Pages (Settings → Pages → Source:
  # GitHub Actions). Runs only after the morning build.
  deploy:
    needs: run
    if: needs.run.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
